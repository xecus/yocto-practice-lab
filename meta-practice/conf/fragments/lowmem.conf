BB_CONF_FRAGMENT_SUMMARY = "RAM の少ないホスト（7GB / 4 コア）向けに並列数を下げる"
BB_CONF_FRAGMENT_DESCRIPTION = "Wrynose の公式の目安は RAM 32GB。既定の並列数（CPU の数）のままだと、\
gcc やカーネルのビルドでメモリが足りなくなるおそれがあるので、BitBake のタスクの数と \
make -j を 2 にする。フラグメントは local.conf のあとに読まれるので、local.conf の設定より優先される。"

BB_NUMBER_THREADS = "2"
PARALLEL_MAKE = "-j 2"
